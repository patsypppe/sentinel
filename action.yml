name: Sentinel MCP conformance
description: >-
  Grade an MCP server against the 2026-07-28 specification. Fails the job on any
  MUST violation, reports what cannot be verified from the wire, and uploads the
  findings to GitHub code scanning.
author: patsypppe
branding:
  icon: check-circle
  color: blue

inputs:
  endpoint:
    description: The MCP endpoint to scan, e.g. http://localhost:3000/mcp. Optional with config or targets.
    required: false
    default: ''
  version:
    description: >-
      The sentinel-mcp-conformance version to install from PyPI. Empty installs the
      copy that ships with this action, so the action and the scanner always agree.
    required: false
    default: ''
  gate:
    description: >-
      Fail the job if any rule of this severity FAILs: must, should, or a
      beyond-spec category (security, style, ops). Empty to never fail.
    required: false
    default: must
  config:
    description: Path to a sentinel.toml. Default is ./sentinel.toml when present.
    required: false
    default: ''
  baseline:
    description: Gate only on findings absent from this baseline file (sentinel baseline create).
    required: false
    default: ''
  snapshot:
    description: A snapshot to compare against, enabling SENTINEL/SECURITY/manifest-drift.
    required: false
    default: ''
  targets:
    description: >-
      A fleet file. When set, every target is scanned with its own credential and gate
      and `endpoint` is ignored. Reports are written to sentinel-fleet/.
    required: false
    default: ''
  no-exec:
    description: "'true' to never run a command named in the [graybox] table."
    required: false
    default: 'false'
  token:
    description: Bearer token to present to the server, if it requires one.
    required: false
    default: ''
  safe:
    description: >-
      'true' to never invoke a tool the server has not annotated read-only.
      Use it for servers you do not own.
    required: false
    default: 'false'
  sarif-file:
    description: Where to write the SARIF report.
    required: false
    default: sentinel.sarif
  sarif-anchor:
    description: >-
      Repository file the code-scanning annotations attach to. A conformance
      finding is about a service, not a file, but GitHub needs a path.
    required: false
    default: README.md
  upload-sarif:
    description: "'true' to upload the report to GitHub code scanning (needs security-events: write)."
    required: false
    default: 'true'
  python-version:
    description: Python used to run the scanner.
    required: false
    default: '3.12'

outputs:
  exit-code:
    description: 0 = gate passed, 1 = gate failed, 2 = the scanner could not run.
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: install sentinel
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$VERSION" ]; then
          python -m pip install --quiet "sentinel-mcp-conformance==$VERSION"
        else
          python -m pip install --quiet "${{ github.action_path }}/harness"
        fi

    - name: scan
      id: scan
      shell: bash
      env:
        SENTINEL_ACTION_ENDPOINT: ${{ inputs.endpoint }}
        SENTINEL_ACTION_GATE: ${{ inputs.gate }}
        SENTINEL_ACTION_SAFE: ${{ inputs.safe }}
        SENTINEL_ACTION_CONFIG: ${{ inputs.config }}
        SENTINEL_ACTION_BASELINE: ${{ inputs.baseline }}
        SENTINEL_ACTION_SNAPSHOT: ${{ inputs.snapshot }}
        SENTINEL_ACTION_TARGETS: ${{ inputs.targets }}
        SENTINEL_ACTION_NOEXEC: ${{ inputs.no-exec }}
        SENTINEL_ACTION_SARIF: ${{ inputs.sarif-file }}
        SENTINEL_ACTION_ANCHOR: ${{ inputs.sarif-anchor }}
        SENTINEL_TOKEN: ${{ inputs.token }}
      run: |
        summary="$RUNNER_TEMP/sentinel-summary.md"
        args=(scan --no-color --sarif-anchor "$SENTINEL_ACTION_ANCHOR")
        [ -n "$SENTINEL_ACTION_ENDPOINT" ] && args+=(--endpoint "$SENTINEL_ACTION_ENDPOINT")
        [ -n "$SENTINEL_ACTION_GATE" ] && args+=(--gate "$SENTINEL_ACTION_GATE")
        [ -n "$SENTINEL_ACTION_CONFIG" ] && args+=(--config "$SENTINEL_ACTION_CONFIG")
        [ -n "$SENTINEL_ACTION_BASELINE" ] && args+=(--baseline "$SENTINEL_ACTION_BASELINE")
        [ -n "$SENTINEL_ACTION_SNAPSHOT" ] && args+=(--snapshot "$SENTINEL_ACTION_SNAPSHOT")
        [ "$SENTINEL_ACTION_SAFE" = "true" ] && args+=(--safe)
        [ "$SENTINEL_ACTION_NOEXEC" = "true" ] && args+=(--no-exec)
        if [ -n "$SENTINEL_ACTION_TARGETS" ]; then
          args+=(--targets "$SENTINEL_ACTION_TARGETS" --format sarif)
        else
          args+=(--format markdown --out "$summary" --also "sarif=$SENTINEL_ACTION_SARIF")
        fi
        set +e
        sentinel "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        {
          if [ -f "$summary" ]; then
            cat "$summary"
          elif [ -f sentinel-fleet/rollup.md ]; then
            echo "### Sentinel: fleet"
            echo
            cat sentinel-fleet/rollup.md
          else
            echo "### Sentinel: MCP conformance"
            echo
            echo "The scanner **could not run** (exit $code). See the job log."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: upload to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && inputs.targets == '' && hashFiles(inputs.sarif-file) != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: sentinel-mcp-conformance

    - name: apply the gate
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: exit "$CODE"
