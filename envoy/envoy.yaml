# Envoy routes and authorizes MCP traffic on the `Mcp-Method` and `Mcp-Name`
# headers ALONE. There is deliberately no JSON/body-parsing filter in this file
# — that is the entire architectural point of the header contract
# (docs/HANDOFF.md §8.2), and tests/e2e/test_header_routing.py asserts the
# absence by grepping this config.
#
# Fleshed out in WP-2. This bootstrap version proves the config parses.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: trusted
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp_trusted
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: trusted_routes
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/mcp" }
                          route: { cluster: broker }

  clusters:
    - name: broker
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: broker
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: broker, port_value: 8080 }
