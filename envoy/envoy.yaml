# Envoy routes and authorizes MCP traffic on the `Mcp-Method` and `Mcp-Name`
# headers ALONE.
#
# There is deliberately NO body-parsing filter anywhere in this file. The only
# HTTP filter on either listener is `envoy.filters.http.router`. That is the
# entire architectural point of the header contract (docs/HANDOFF.md §8.2): a
# gateway or WAF must be able to route and authorize without parsing the JSON
# body, which for a streaming JSON-RPC endpoint means without buffering it
# either.
#
# tests/e2e/test_header_routing.py parses this file and asserts the filter chain
# contains nothing but the router, so adding a `lua`, `wasm`, `buffer`,
# `json_to_metadata`, `grpc_json_transcoder` or `ext_proc` filter here is a test
# failure rather than a silent erosion of the property.
#
# The other half of the demonstration lives in the broker: it validates the
# headers against the body, so a gateway that routed on the headers and a server
# that acted on the body can never disagree about what happened. Routed by
# header, rejected by body check.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # ---------------------------------------------------------------------
    # TRUSTED listener — the full method surface.
    # ---------------------------------------------------------------------
    - name: trusted
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp_trusted
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: trusted_routes
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        # A request with no Mcp-Method cannot be routed at all
                        # without reading the body, so the gateway refuses it
                        # here rather than guessing.
                        - name: reject_unroutable
                          match:
                            prefix: "/mcp"
                            headers:
                              - name: "Mcp-Method"
                                present_match: true
                                invert_match: true
                          direct_response:
                            status: 400
                            body:
                              inline_string: |
                                {"jsonrpc":"2.0","error":{"code":-32020,"message":"Mcp-Method is required: this gateway routes on headers and does not parse request bodies"}}
                          response_headers_to_add:
                            - header: { key: "X-Sentinel-Route", value: "reject-unroutable" }

                        - name: full_surface
                          match: { prefix: "/mcp" }
                          route: { cluster: broker }
                          response_headers_to_add:
                            - header: { key: "X-Sentinel-Route", value: "trusted-full" }

    # ---------------------------------------------------------------------
    # UNTRUSTED listener — the ops.* tool family is denied at the gateway.
    #
    # The authorization decision is made from two headers and nothing else. The
    # gateway never learns which arguments the call carried, and does not need
    # to: `Mcp-Method: tools/call` plus `Mcp-Name: ops.*` is sufficient to
    # decide, and the broker's header/body check makes the headers binding.
    # ---------------------------------------------------------------------
    - name: untrusted
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mcp_untrusted
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: untrusted_routes
                  virtual_hosts:
                    - name: mcp
                      domains: ["*"]
                      routes:
                        - name: reject_unroutable
                          match:
                            prefix: "/mcp"
                            headers:
                              - name: "Mcp-Method"
                                present_match: true
                                invert_match: true
                          direct_response:
                            status: 400
                            body:
                              inline_string: |
                                {"jsonrpc":"2.0","error":{"code":-32020,"message":"Mcp-Method is required: this gateway routes on headers and does not parse request bodies"}}
                          response_headers_to_add:
                            - header: { key: "X-Sentinel-Route", value: "reject-unroutable" }

                        # The policy. Two header matches, no body.
                        - name: deny_ops_family
                          match:
                            prefix: "/mcp"
                            headers:
                              - name: "Mcp-Method"
                                string_match: { exact: "tools/call" }
                              - name: "Mcp-Name"
                                string_match: { prefix: "ops." }
                          direct_response:
                            status: 403
                            body:
                              inline_string: |
                                {"jsonrpc":"2.0","error":{"code":-32020,"message":"the ops.* tool family is not reachable from this route"}}
                          response_headers_to_add:
                            - header: { key: "X-Sentinel-Route", value: "untrusted-deny-ops" }

                        - name: allow_remainder
                          match: { prefix: "/mcp" }
                          route: { cluster: broker }
                          response_headers_to_add:
                            - header: { key: "X-Sentinel-Route", value: "untrusted-allow" }

  clusters:
    - name: broker
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: broker
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: broker, port_value: 8080 }
