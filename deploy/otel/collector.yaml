# Minimal collector. The broker ingests `traceparent` from the request `_meta`
# (SEP-414) and continues the client's trace rather than starting a new one, so
# a client-to-server joined trace is visible end to end (demo step 8).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
