# On a GitHub release this publishes the wheel to PyPI as `sentinel-mcp-conformance`,
# pushes a multi-arch container image to GHCR, signs both with cosign (keyless, using
# this workflow's GitHub OIDC identity, so there is no signing key to leak) and
# attaches a CycloneDX SBOM of the harness to the release.
#
# Verify a release:
#   cosign verify ghcr.io/patsypppe/sentinel:<version> \
#     --certificate-identity-regexp 'https://github.com/patsypppe/sentinel/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# PyPI: Uses PyPI trusted publishing, so no token is stored:
# the one-time setup is adding this repository and workflow as a trusted
# publisher on https://pypi.org/manage/account/publishing/ (environment: pypi).

name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: the tag matches the package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('harness/pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match harness version $VERSION"
            exit 1
          fi
      - run: uv build harness --out-dir dist
      - name: the wheel installs and runs
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/sentinel version
          /tmp/smoke/bin/sentinel-mcp-conformance catalog validate
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    name: container image, signed
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sentinel:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sentinel:latest
      - name: sign the image by digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/sentinel@${DIGEST}"
      - name: the image runs
        run: |
          docker run --rm "ghcr.io/${{ github.repository_owner }}/sentinel:${{ steps.meta.outputs.version }}" version

  attest:
    name: sign the wheel, attach the SBOM
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: sigstore/cosign-installer@v3
      - name: sign each distribution file
        run: |
          for f in dist/*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: SBOM of the harness
        uses: anchore/sbom-action@v0
        with:
          path: harness
          format: cyclonedx-json
          output-file: sentinel-harness.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.sigstore.json sentinel-harness.cdx.json --clobber
