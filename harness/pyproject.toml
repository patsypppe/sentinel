[project]
name = "toolgauge"
version = "0.4.0"
description = "Conformance checker for MCP servers. Grades any MCP server against the normative requirements, reports which MUSTs it cannot verify black-box, and inventories deprecated-feature debt."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    # Fleet files are YAML; toolgauge.toml itself is TOML and needs nothing.
    "pyyaml>=6.0",
]

keywords = ["mcp", "model-context-protocol", "conformance", "testing", "sarif", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/patsypppe/sentinel"
Repository = "https://github.com/patsypppe/sentinel"
Issues = "https://github.com/patsypppe/sentinel/issues"

[project.scripts]
toolgauge = "toolgauge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolgauge"]

[tool.hatch.build.targets.wheel.force-include]
"../fixtures/server" = "toolgauge/_fixtures/server"
