[project]
# The distribution name is not the import or command name: "sentinel" on PyPI
# belongs to an unrelated project. The package still imports as `sentinel` and
# installs the `sentinel` command, plus a second command matching the
# distribution so `uvx sentinel-mcp-conformance scan ...` works with no --from.
name = "sentinel-mcp-conformance"
version = "0.4.0"
description = "Conformance checker for MCP servers. Grades any MCP server against the normative requirements, reports which MUSTs it cannot verify black-box, and inventories deprecated-feature debt."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    # Fleet files are YAML; sentinel.toml itself is TOML and needs nothing.
    "pyyaml>=6.0",
]

keywords = ["mcp", "model-context-protocol", "conformance", "testing", "sarif", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/patsypppe/sentinel"
Repository = "https://github.com/patsypppe/sentinel"
Issues = "https://github.com/patsypppe/sentinel/issues"

[project.scripts]
sentinel = "sentinel.cli:app"
sentinel-mcp-conformance = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.hatch.build.targets.wheel.force-include]
"../fixtures/server" = "sentinel/_fixtures/server"
